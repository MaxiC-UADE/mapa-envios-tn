<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zonas ML noviembre</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5EFE4;--ink:#2A2521;--muted:#6B6157;--line:#D9CFBF;--acc:#A8431F;--c2:#4B6B4A;--c3:#C9A24B}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Albert Sans",system-ui,sans-serif}
header{padding:28px 32px 12px;max-width:1280px;margin:auto}h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 0}
.kpi{padding:12px 0}.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:13px}
main{display:grid;grid-template-columns:1fr 340px;gap:24px;padding:16px 32px 32px;max-width:1280px;margin:auto}
#map{height:calc(100vh - 220px);min-height:520px;border:1px solid var(--line);border-radius:6px;background:#EAE3D6}
aside h2{font-size:15px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
td,th{padding:6px 0;border-bottom:1px solid var(--line);text-align:left}th{border-bottom:1.5px solid var(--ink);font-weight:600}
td.n,th.n{text-align:right}.bar{height:4px;background:var(--acc);border-radius:2px;margin-top:3px;opacity:.75}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 14px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.leaflet-tooltip{font:13px/1.4 "Albert Sans",sans-serif;border-color:var(--line)}
@media(max-width:860px){main{grid-template-columns:1fr;padding:12px 16px}header{padding:20px 16px 8px}.kpis{grid-template-columns:repeat(2,1fr)}#map{height:60vh;min-height:380px}}
</style></head><body>
