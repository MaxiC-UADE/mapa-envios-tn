.kpi{padding:12px 0}.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:13px}

table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
td,th{padding:6px 0;border-bottom:1px solid var(--line);text-align:left}th{border-bottom:1.5px solid var(--ink);font-weight:600}
td.n,th.n{text-align:right}.bar{height:4px;background:var(--acc);border-radius:2px;margin-top:3px;opacity:.75}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 14px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}
.leaflet-tooltip{font:13px/1.4 "Albert Sans",sans-serif;border-color:var(--line)}
@media(max-width:860px){main{grid-template-columns:1fr;padding:12px 16px}header{padding:20px 16px 8px}.kpis{grid-template-columns:repeat(2,1fr)}#map{height:60vh;min-height:380px}}
